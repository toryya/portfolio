<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viktoria Kuleshova | Product Designer</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="alternate" hreflang="ru" href="https://viktoriakuleshova.ru/ru/">
  <link rel="alternate" hreflang="en" href="https://viktoriakuleshova.ru/en/">
  <link rel="alternate" hreflang="x-default" href="https://viktoriakuleshova.ru/en/">
  <script>
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'ru' && lang !== 'en') {
        var langs = navigator.languages || [navigator.language || ''];
        lang = langs.some(function (l) { return /^(ru|be|uk|kk)\b/i.test(l); }) ? 'ru' : 'en';
      }
      location.replace('/' + lang + '/' + location.hash);
    })();
  </script>
</head>
<body>
  <p><a href="/en/">English</a> · <a href="/ru/">Русский</a></p>
</body>
</html>
